<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV — Интернет-телеканалы 24/7</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  :root {
    --bg: #0b0e18; --panel: #141a2c; --panel2: #1a2138; --border: #2a3352;
    --text: #e8ecf7; --muted: #8a93b2; --accent: #ff007f; --accent2: #7928ca; --green: #39e75f;
    --grad: linear-gradient(90deg, #ff007f, #7928ca);
  }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #1c2444 0%, var(--bg) 55%);
    color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh;
  }
  .app-container { display: flex; max-width: 1400px; margin: 0 auto; min-height: 100vh; padding: 20px; gap: 20px; }
  
  /* Сайдбар каналов (IPTV плейлист) */
  .sidebar { width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 16px; height: fit-content; }
  .sidebar h2 { font-size: 14px; letter-spacing: 2px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .channel-list { display: flex; flex-direction: column; gap: 8px; }
  .channel-btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; border-radius: 14px; cursor: pointer; text-align: left; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; transition: .15s; }
  .channel-btn:hover { border-color: var(--accent); background: rgba(255,0,127,0.05); }
  .channel-btn.active { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 4px 15px rgba(255,0,127,0.4); }
  .channel-num { font-size: 12px; opacity: 0.7; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 6px; }

  /* Основная область плеера */
  .main-content { flex: 1; display: flex; flex-direction: column; gap: 18px; max-width: 1000px; }
  
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 0; flex-wrap: wrap; }
  .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand-logo { font-size: 26px; font-weight: 900; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 1px; }
  .live-clock { text-align: right; }
  .live-clock .time { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .live-clock .date { color: var(--muted); font-size: 12px; }
  .live-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(57,231,95,.12); border: 1px solid rgba(57,231,95,.45); color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 5px 10px; border-radius: 999px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; box-shadow:0 0 0 0 rgba(57,231,95,.6);} 50% { opacity:.6; box-shadow:0 0 0 6px rgba(57,231,95,0);} }

  .tv { background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--border); border-radius: 24px; padding: 14px; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
  .screen { position: relative; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 16/9; width: 100%; display: flex; align-items: center; justify-content: center; }
  
  .screen-guard { position: absolute; inset: 0; z-index: 5; background: transparent; pointer-events: auto; }
  .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; display: flex; align-items: center; justify-content: center; background: #000; }
  .video-container iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* 16:9 PNG водяной знак на весь экран */
  .live-watermark { position: absolute; inset: 0; z-index: 3; pointer-events: none; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.5s ease; }
  .live-watermark img { width: 100%; height: 100%; object-fit: fill; display: block; }
  .live-watermark img.visible { opacity: 1; }

  /* Заставка на весь экран */
  .off-air { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #000; z-index: 20; text-align: center; pointer-events: auto; }
  .off-air-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; z-index: 1; display: block; }
  .off-air-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: rgba(5,7,14,0.4); width: 100%; height: 100%; padding: 20px; }
  
  .power-btn { background: var(--grad); color: #fff; border: none; font-weight: 800; font-size: 16px; padding: 14px 32px; border-radius: 999px; cursor: pointer; box-shadow: 0 8px 24px rgba(255,0,127,.6); transition: transform .15s; pointer-events: auto; }
  .power-btn:hover { transform: translateY(-2px); }
  
  .tv-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 6px 4px; gap: 12px; flex-wrap: wrap; }
  .controls { display: flex; gap: 8px; }
  .controls button { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 0 14px; height: 40px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .controls button:hover { border-color: var(--accent); color: #fff; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 18px 20px; }
  .card h2 { font-size: 12px; letter-spacing: 2px; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .now-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .progress { height: 8px; background: #0d1122; border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--grad); border-radius: 999px; width: 0%; transition: width 1s linear; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }

  .next-item { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid rgba(42,51,82,.4); font-size: 14px; }
  .next-item:last-child { border-bottom: none; }
  .next-item .when { color: var(--accent); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding-top: 10px; }

  @media (max-width: 900px) {
    .app-container { flex-direction: column; }
    .sidebar { width: 100%; }
  }
</style>
</head>

    </div>

    <footer>IPTV Portal · Вещание 24/7</footer>
  </div>
</div>

<script>
function parseDuration(val) {
  if (typeof val === 'number') return val;
  if (!val) return 0;
  const parts = String(val).split(':').map(Number);
  if (parts.length === 3) {
    return parts[0] * 3600 + parts[1] * 60 + parts[2];
  } else if (parts.length === 2) {
    return parts[0] * 60 + parts[1];
  }
  return Number(val) || 0;
}

const CHANNELS = RAW_CHANNELS.map(chan => ({
  ...chan,
  schedule: chan.schedule.map(item => ({
    ...item,
    duration: parseDuration(item.duration)
  }))
}));

let currentChanIdx = 0;
let player = null;
let muted = true;
let currentIdx = -1;

function getActiveChannel() {
  return CHANNELS[currentChanIdx];
}

function getTotalDuration(schedule) {
  return schedule.reduce((a, x) => a + x.duration, 0);
}

function totalSecondsSinceEpoch() {
  const baseDateUTC = Date.UTC(2026, 0, 1, 0, 0, 0);
  return Math.floor((Date.now() - baseDateUTC) / 1000);
}

function currentPosition(schedule) {
  const total = getTotalDuration(schedule);
  let t = totalSecondsSinceEpoch() % total;
  if (t < 0) t += total;
  let acc = 0;
  for (let i = 0; i < schedule.length; i++) {
    if (t < acc + schedule[i].duration) return { idx: i, start: t - acc };
    acc += schedule[i].duration;
  }
  return { idx: 0, start: 0 };
}

function updateLogos() {
  const chan = getActiveChannel();
  document.getElementById('watermark-logo-img').src = chan.logo;
  document.getElementById('overlay-logo-img').src = chan.logo;
  document.getElementById('header-brand').innerText = chan.name;
  document.getElementById('channel-footer-name').innerText = `Телеканал «${chan.name}»`;
}

function switchChannel(idx) {
  currentChanIdx = idx;
  currentIdx = -1;
  
  const btns = document.querySelectorAll('.channel-btn');
  btns.forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });

  updateLogos();

  const chan = getActiveChannel();
  const pos = currentPosition(chan.schedule);
  currentIdx = pos.idx;

  if (player && typeof player.loadVideoById === 'function') {
    player.loadVideoById({ videoId: chan.schedule[pos.idx].id, startSeconds: pos.start });
  }
  
  document.getElementById('now-title').innerText = chan.schedule[pos.idx].title;
  renderNextList(pos.idx, pos.start);
}

function goToMenu() {
  const sidebar = document.getElementById('sidebar-menu');
  sidebar.scrollIntoView({ behavior: 'smooth' });
}

var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
var firstScriptTag = document.getElementsByTagName('script')[0];
firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

function onYouTubeIframeAPIReady() {
  updateLogos();
  const chan = getActiveChannel();
  const pos = currentPosition(chan.schedule);
  currentIdx = pos.idx;
  try {
    player = new YT.Player('player', {
      videoId: chan.schedule[pos.idx].id,
      playerVars: { 
        'autoplay': 1, 
        'controls': 0, 
        'disablekb': 1, 
        'fs': 0, 
        'rel': 0, 
        'modestbranding': 1,
        'hl': 'ru',
        'start': Math.floor(pos.start) 
      },
      events: { 
        'onReady': onPlayerReady, 
        'onStateChange': onPlayerStateChange,
        'onError': onPlayerError
      }
    });
  } catch(e) {
    console.error(e);
  }
}

function onPlayerError(event) {
  const chan = getActiveChannel();
  const pos = currentPosition(chan.schedule);
  currentIdx = (pos.idx + 1) % chan.schedule.length;
  const nextItem = chan.schedule[currentIdx];
  if(player && typeof player.loadVideoById === 'function') {
    player.loadVideoById({ videoId: nextItem.id, startSeconds: 0 });
  }
}

function onPlayerReady(event) {
  event.target.mute();
  event.target.playVideo();

  const chan = getActiveChannel();
  const pos = currentPosition(chan.schedule);
  document.getElementById('now-title').innerText = chan.schedule[pos.idx].title;
  renderNextList(pos.idx, pos.start);

  setInterval(updateLive, 1000);
}

function startTV() {
  if (player && player.unMute) {
    player.unMute();
    player.setVolume(100);
    muted = false;
    document.getElementById('mute-btn').innerText = '🔊 Звук';
  }
  const overlay = document.getElementById('unmute-overlay');
  if (overlay) overlay.style.display = 'none';

  const watermark = document.getElementById('watermark-logo-img');
  if (watermark) watermark.classList.add('visible');
}

function toggleMute() {
  if (!player) return;
  if (muted) {
    player.unMute();
    muted = false;
    document.getElementById('mute-btn').innerText = '🔊 Звук';
  } else {
    player.mute();
    muted = true;
    document.getElementById('mute-btn').innerText = '🔇 Звук';
  }
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.ENDED) {
    const chan = getActiveChannel();
    const pos = currentPosition(chan.schedule);
    currentIdx = pos.idx;
    if (player && typeof player.loadVideoById === 'function') {
      player.loadVideoById({ videoId: chan.schedule[pos.idx].id, startSeconds: pos.start });
    }
  }
}

function fmt(s) {
  if (isNaN(s)) return "00:00";
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}

function updateLive() {
  const now = new Date();
  document.getElementById('clock').innerText = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  document.getElementById('date').innerText = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

  const chan = getActiveChannel();
  const pos = currentPosition(chan.schedule);
  const item = chan.schedule[pos.idx];

  let curTime = pos.start;
  if (player && typeof player.getCurrentTime === 'function') {
    const val = player.getCurrentTime();
    if (!isNaN(val)) curTime = val;
  }

  if (currentIdx !== pos.idx) {
    currentIdx = pos.idx;
    if (player && typeof player.loadVideoById === 'function') {
      player.loadVideoById({ videoId: item.id, startSeconds: pos.start });
    }
    document.getElementById('now-title').innerText = item.title;
    renderNextList(pos.idx, curTime);
  } else if (player && typeof player.seekTo === 'function') {
    if (Math.abs(curTime - pos.start) > 5) {
      player.seekTo(pos.start, true);
      curTime = pos.start;
    }
  }

  const elapsed = curTime;
  const remain = item.duration - curTime;
  const pct = Math.min(100, Math.max(0, (elapsed / item.duration) * 100));

  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('elapsed').innerText = fmt(elapsed);
  document.getElementById('remain').innerText = 'осталось ' + fmt(remain);
}

function renderNextList(idx, curTime) {
  const chan = getActiveChannel();
  let html = '';
  for (let i = 1; i <= 3; i++) {
    const nextIdx = (idx + i) % chan.schedule.length;
    const nextItem = chan.schedule[nextIdx];
    let calcTime = 0;
    for (let j = 0; j < i; j++) {
      const targetIdx = (idx + j) % chan.schedule.length;
      calcTime += (j === 0 ? (chan.schedule[targetIdx].duration - curTime) : chan.schedule[targetIdx].duration);
    }
    const targetDate = new Date(Date.now() + calcTime * 1000);
    const timeStr = String(targetDate.getHours()).padStart(2, '0') + ':' + String(targetDate.getMinutes()).padStart(2, '0');
    html += `<div class="next-item"><span class="title">${nextItem.title}</span><span class="when">~${timeStr}</span></div>`;
  }
  document.getElementById('next-list').innerHTML = html;
}
