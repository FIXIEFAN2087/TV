<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV — 24/7</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  :root {
    --bg: #0b0e18; --panel: #141a2c; --panel2: #1a2138; --border: #2a3352;
    --text: #e8ecf7; --muted: #8a93b2; --accent: #ff007f; --green: #39e75f;
    --grad: linear-gradient(90deg, #ff007f, #7928ca);
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .app-container { display: flex; max-width: 1400px; margin: 0 auto; min-height: 100vh; padding: 20px; gap: 20px; }
  
  .sidebar { width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; height: fit-content; }
  .sidebar h2 { font-size: 13px; letter-spacing: 2px; color: var(--muted); font-weight: 700; }
  .channel-list { display: flex; flex-direction: column; gap: 8px; }
  .channel-btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 14px; border-radius: 12px; cursor: pointer; text-align: left; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; transition: .15s; }
  .channel-btn:hover { border-color: var(--accent); }
  .channel-btn.active { background: var(--grad); border-color: transparent; color: #fff; box-shadow: 0 4px 15px rgba(255,0,127,0.4); }
  .channel-num { font-size: 11px; opacity: 0.7; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 6px; }

  .main-content { flex: 1; display: flex; flex-direction: column; gap: 16px; max-width: 1000px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
  .brand-logo { font-size: 24px; font-weight: 900; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
  .live-clock { text-align: right; }
  .live-clock .time { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .live-clock .date { color: var(--muted); font-size: 12px; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(57,231,95,.1); border: 1px solid rgba(57,231,95,.4); color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 4px 10px; border-radius: 999px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

  .tv { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 12px; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
  .screen { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 16/9; width: 100%; }
  
  .screen-guard { position: absolute; inset: 0; z-index: 5; pointer-events: auto; }
  .video-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .video-container iframe { width: 100%; height: 100%; border: 0; }

  .live-watermark { position: absolute; inset: 0; z-index: 3; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .live-watermark img { width: 100%; height: 100%; object-fit: fill; display: block; opacity: 0; transition: opacity 0.5s ease; }
  .live-watermark img.visible { opacity: 1; }

  .off-air { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #000; z-index: 20; text-align: center; gap: 14px; }
  .power-btn { background: var(--grad); color: #fff; border: none; font-weight: 800; font-size: 16px; padding: 14px 28px; border-radius: 999px; cursor: pointer; box-shadow: 0 8px 24px rgba(255,0,127,.6); transition: transform .15s; }
  .power-btn:hover { transform: translateY(-2px); }
  
  .tv-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px 2px; }
  .controls button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); padding: 0 16px; height: 38px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: .15s; }
  .controls button:hover { border-color: var(--accent); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; }
  .card h2 { font-size: 11px; letter-spacing: 2px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .now-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .progress { height: 6px; background: #0d1122; border-radius: 999px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--grad); width: 0%; transition: width 1s linear; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }

  .next-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(42,51,82,.4); font-size: 13px; }
  .next-item:last-child { border-bottom: none; }
  .next-item .when { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

  footer { text-align: center; color: var(--muted); font-size: 11px; }

  @media (max-width: 900px) { .app-container { flex-direction: column; } .sidebar { width: 100%; } }
</style>

      <div class="progress"><div id="prog"></div></div>

    <div class="card">

      <div id="next-list"></div>
    </div>

    <footer>TV 24/7</footer>
  </div>
</div>

function parseDuration(val) {
  if (typeof val === 'number') return val;
  if (!val) return 0;
  const p = String(val).split(':').map(Number);
  return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p.length === 2 ? p[0]*60 + p[1] : Number(val) || 0;
}

const CHANNELS = RAW_CHANNELS.map(c => ({
  ...c, schedule: c.schedule.map(i => ({ ...i, duration: parseDuration(i.duration) }))
}));

let curChan = 0, player = null, muted = true, curIdx = -1;

function renderList() {
  const list = document.getElementById('channel-list');
  list.innerHTML = CHANNELS.map((c, i) => `
    <button class="channel-btn ${i === curChan ? 'active' : ''}" onclick="switchChan(${i})">
      <span class="name">${i + 1}. ${c.name}</span><span class="channel-num">LIVE</span>
    </button>`).join('');
}

function getPos(sched) {
  const total = sched.reduce((a, x) => a + x.duration, 0);
  let t = Math.floor((Date.now() - Date.UTC(2026, 0, 1)) / 1000) % total;
  if (t < 0) t += total;
  let acc = 0;
  for (let i = 0; i < sched.length; i++) {
    if (t < acc + sched[i].duration) return { idx: i, start: t - acc };
    acc += sched[i].duration;
  }
  return { idx: 0, start: 0 };
}

function updateUI() {
  const c = CHANNELS[curChan];
  document.getElementById('watermark-logo-img').src = c.logo;
  document.getElementById('header-brand').innerText = c.name;
  document.getElementById('channel-footer-name').innerText = `Телеканал «${c.name}»`;
  document.getElementById('overlay-title').innerText = `Телеканал «${c.name}»`;
}

function switchChan(i) {
  curChan = i; curIdx = -1;
  renderList(); updateUI();
  const pos = getPos(CHANNELS[curChan].schedule);
  curIdx = pos.idx;
  
  // Установка названия при смене канала
  document.getElementById('now-title').innerText = CHANNELS[curChan].schedule[pos.idx].title;

  if (player?.loadVideoById) {
    player.loadVideoById({ videoId: CHANNELS[curChan].schedule[pos.idx].id, startSeconds: pos.start });
  }
}

// Загрузка YT API
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  renderList(); updateUI();
  const pos = getPos(CHANNELS[curChan].schedule);
  curIdx = pos.idx;
  
  // Установка названия при старте
  document.getElementById('now-title').innerText = CHANNELS[curChan].schedule[pos.idx].title;

  player = new YT.Player('player', {
    videoId: CHANNELS[curChan].schedule[pos.idx].id,
    playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, start: Math.floor(pos.start) },
    events: { onReady: e => { e.target.mute(); e.target.playVideo(); setInterval(tick, 1000); } }
  });
}

function startTV() {
  player?.unMute();
  player?.setVolume(100);
  muted = false;
  document.getElementById('mute-btn').innerText = '🔊 Звук';
  document.getElementById('unmute-overlay').style.display = 'none';
  document.getElementById('watermark-logo-img').classList.add('visible');
}

function toggleMute() {
  if (!player) return;
  muted = !muted;
  muted ? player.mute() : player.unMute();
  document.getElementById('mute-btn').innerText = muted ? '🔇 Звук' : '🔊 Звук';
}

function fmt(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}

function tick() {
  const now = new Date();
  document.getElementById('clock').innerText = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  document.getElementById('date').innerText = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });

  const c = CHANNELS[curChan];
  const pos = getPos(c.schedule);
  const item = c.schedule[pos.idx];
  let curTime = player?.getCurrentTime ? player.getCurrentTime() : pos.start;
  if (isNaN(curTime)) curTime = pos.start;

  if (curIdx !== pos.idx) {
    curIdx = pos.idx;
    player?.loadVideoById?.({ videoId: item.id, startSeconds: pos.start });
    document.getElementById('now-title').innerText = item.title;
  }

  document.getElementById('prog').style.width = Math.min(100, (curTime / item.duration) * 100) + '%';
  document.getElementById('elapsed').innerText = fmt(curTime);
  document.getElementById('remain').innerText = 'осталось ' + fmt(item.duration - curTime);

  // Рендер блока "Далее"
  let html = '';
  for (let i = 1; i <= 3; i++) {
    const nextItem = c.schedule[(pos.idx + i) % c.schedule.length];
    let calc = (i === 1 ? item.duration - curTime : c.schedule[(pos.idx + i - 1) % c.schedule.length].duration);
    const targetDate = new Date(Date.now() + calc * 1000);
    html += `<div class="next-item"><span>${nextItem.title}</span><span class="when">~${String(targetDate.getHours()).padStart(2,'0')}:${String(targetDate.getMinutes()).padStart(2,'0')}</span></div>`;
  }
  document.getElementById('next-list').innerHTML = html;
}
</script>
</body>
</html>
